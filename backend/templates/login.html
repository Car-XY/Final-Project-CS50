{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<div class="col-span-12 flex flex-1 items-center justify-center">
  <div class="w-full max-w-sm rounded-2xl border border-zinc-200 bg-white p-8 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
    <h1 class="mb-6 text-center text-2xl font-semibold tracking-tight text-zinc-800 dark:text-zinc-100">
      Log in
    </h1>

    <form action="/login" method="post" class="flex flex-col gap-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-zinc-600 dark:text-zinc-300">
          Username
        </label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          placeholder="Enter your username"
          class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-800 outline-none placeholder:text-zinc-400 focus:border-purple-600 focus:ring-2 focus:ring-purple-600/30 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-100"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-zinc-600 dark:text-zinc-300">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Enter your password"
          class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-800 outline-none placeholder:text-zinc-400 focus:border-purple-600 focus:ring-2 focus:ring-purple-600/30 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-100"
        />
      </div>

      <button
        type="submit"
        class="mt-2 w-full rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-purple-700 active:opacity-80"
      >
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-zinc-500 dark:text-zinc-400">
      Don't have an account?
      <a href="/register" class="font-medium text-purple-600 hover:underline dark:text-purple-400">Register</a>
    </p>
  </div>
</div>
{% endblock %}
