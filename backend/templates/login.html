{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<div class="col-span-12 flex flex-1 items-center justify-center">
  <div class="w-full max-w-sm rounded-2xl border border-border bg-surface p-8 shadow-sm dark:border-border-dark dark:bg-surface-dark">
    <h1 class="mb-6 text-center text-2xl font-semibold tracking-tight text-text dark:text-text-dark">
      Log In
    </h1>

    <form action="/login" method="post" class="flex flex-col gap-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-text-muted dark:text-text-dark">
          Username
        </label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          placeholder="Enter your username"
          class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text outline-none placeholder:text-text-translucent focus:border-brand focus:ring-2 focus:ring-brand/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-text-muted dark:text-text-dark">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Enter your password"
          class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text outline-none placeholder:text-text-translucent focus:border-brand focus:ring-2 focus:ring-brand/30 dark:border-border-dark dark:bg-surface-dark dark:text-text-dark"
        />
      </div>

      <button
        type="submit"
        class="rounded-lg bg-brand px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-hover active:opacity-80"
      >
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-text-muted dark:text-text-dark">
      Don't have an account?
      <a href="/register" class="font-medium text-brand hover:underline dark:text-brand-light">Register</a>
    </p>
  </div>
</div>
{% endblock %}
